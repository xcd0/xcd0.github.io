<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>qft download</title>
	<style>
		body{max-width:640px;margin:64px auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#18212b}
		button{font:inherit;padding:10px 18px;cursor:pointer}
		#error{color:#b00020;white-space:pre-wrap}
	</style>
</head>
<body>
	<h1>qftをダウンロード</h1>
	<p id="status">ダウンロードを準備しています。</p>
	<button id="download" type="button" hidden>もう一度ダウンロード</button>
	<p id="error"></p>
	<script>
		const variants = {
			minimal: { path: "./minimal/qft.html", filename: "qft-minimal.html" },
			vanilla: { path: "./vanilla/qft.html", filename: "qft-vanilla.html" },
		};
		const params = new URLSearchParams(location.search);
		const variant = variants[params.get("variant")];
		const status = document.getElementById("status");
		const button = document.getElementById("download");
		const error = document.getElementById("error");

		async function download() {
			if (!variant) {
				status.textContent = "ダウンロード対象が指定されていません。";
				return;
			}
			button.hidden = true;
			error.textContent = "";
			status.textContent = `${variant.filename} を準備しています。`;
			try {
				const response = await fetch(variant.path, { cache: "no-store" });
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				const blob = await response.blob();
				const url = URL.createObjectURL(blob);
				const anchor = document.createElement("a");
				anchor.href = url;
				anchor.download = variant.filename;
				document.body.appendChild(anchor);
				anchor.click();
				anchor.remove();
				setTimeout(() => URL.revokeObjectURL(url), 1000);
				status.textContent = `${variant.filename} のダウンロードを開始しました。`;
				button.hidden = false;
			} catch (cause) {
				status.textContent = "ダウンロードを開始できませんでした。";
				error.textContent = cause instanceof Error ? cause.message : String(cause);
				button.hidden = false;
			}
		}

		button.addEventListener("click", download);
		download();
	</script>
</body>
</html>
